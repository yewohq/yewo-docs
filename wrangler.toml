name = "yewo-docs"
main = "worker/index.ts"
compatibility_date = "2026-10-29"

# run_worker_first puts the Worker in front of the asset store rather than
# behind it, where content negotiation would never see a request.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[routes]]
pattern = "docs.tryyewo.dev"
custom_domain = true
